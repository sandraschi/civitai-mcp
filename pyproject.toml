[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "civitai-mcp"
version = "0.1.1"
description = "Civitai (Civitai marketplace) MCP bridge with human-approved outbox for fleet-PR drafts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.9.0"]

[project.scripts]
civitai-mcp = "civitai_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/civitai_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
